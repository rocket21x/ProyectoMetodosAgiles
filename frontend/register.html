<!--Pagina para Crear Cuenta-->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Localify</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }
        .container {
            width: 45%;
            margin: 60px auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            padding: 10px 20px;
            background: #2F56E4;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background: #2F56E4;
        }
        .error {
            color: red;
            font-size: 14px;
        }
    </style>

</head>
<body>

<div class="container">
    <h2>Crear Cuenta</h2>

    <label>Nombre:</label>
    <input type="text" id="first_name">

    <label>Apellido:</label>
    <input type="text" id="last_name">

    <label>Correo:</label>
    <input type="email" id="email">

    <label>Crear contraseña:</label>
    <input type="password" id="password">

    <label>Confirmar contraseña:</label>
    <input type="password" id="confirm_password">

    <p id="passError" class="error"></p>

    <label>Teléfono:</label>
    <input type="text" id="phone">

    <button onclick="registerUser()">Registrarme</button>
</div>

<script>
    function registerUser() {
        const pass = document.getElementById("password").value;
        const confirm = document.getElementById("confirm_password").value;

        if (pass !== confirm) {
            document.getElementById("passError").textContent = "Las contraseñas no coinciden.";
            return;
        }

        document.getElementById("passError").textContent = "";

        alert("Aquí se enviarán los datos al backend para crear la cuenta.");
    }
</script>

</body>
</html>
